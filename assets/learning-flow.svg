<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 820" width="1440" height="820" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Terminology — how a term becomes a diagram</title>
  <desc>The learner picks a term from their knowledge graph. A prompt is built from four dimensions (term, classification, abstraction level, visual format), sent to a model, and the returned diagram source is validated, rendered, streamed to the app over WebSocket, and attached back to the graph.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <style>
      .title { font-size: 28px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 15px; fill: #64748b; }
      .h { font-size: 17px; font-weight: 700; fill: #0f172a; }
      .h2 { font-size: 14px; font-weight: 600; fill: #0f172a; }
      .sub { font-size: 12.5px; fill: #475569; }
      .note { font-size: 12.5px; fill: #64748b; font-style: italic; }
      .label { font-size: 12px; fill: #475569; }
      .chip { font-size: 12px; font-weight: 600; }
      .dim { font-size: 11px; font-weight: 700; fill: #64748b; letter-spacing: .06em; text-transform: uppercase; }
      .edge { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .edge-retry { stroke: #dc2626; stroke-width: 2; fill: none; stroke-dasharray: 6 5; marker-end: url(#arrow-red); }
      .node { fill: #ffffff; stroke: #0284c7; stroke-width: 2; }
      .link { stroke: #0284c7; stroke-width: 2; }
      .step { font-size: 12px; font-weight: 700; fill: #ffffff; }
    </style>
  </defs>

  <rect width="1440" height="820" fill="#ffffff"/>

  <text x="40" y="52" class="title">Terminology — how a term becomes a diagram</text>
  <text x="40" y="80" class="subtitle">Prompting pipeline and validation loop. Four prompt dimensions shape every request; HTML is the preferred visual output.</text>

  <!-- Step badges helper: circle + number -->
  <!-- 1. Knowledge graph -->
  <g>
    <rect x="40" y="130" width="380" height="350" rx="16" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
    <circle cx="64" cy="154" r="12" fill="#0284c7"/><text x="64" y="158" class="step" text-anchor="middle">1</text>
    <text x="84" y="159" class="h">Learner's knowledge graph</text>
    <text x="84" y="178" class="sub">terms the user has added, linked to each other</text>

    <!-- person -->
    <circle cx="230" cy="222" r="13" class="node"/>
    <path d="M230,235 V268 M230,245 L208,262 M230,245 L252,262 M230,268 L214,296 M230,268 L246,296" stroke="#0284c7" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <text x="268" y="230" class="sub">you</text>

    <!-- level 1 -->
    <line x1="230" y1="268" x2="150" y2="340" class="link"/>
    <line x1="230" y1="268" x2="310" y2="340" class="link"/>
    <circle cx="150" cy="350" r="22" class="node"/>
    <text x="150" y="354" class="chip" text-anchor="middle" fill="#0c4a6e">Docker</text>
    <circle cx="310" cy="350" r="22" class="node"/>
    <text x="310" y="354" class="chip" text-anchor="middle" fill="#0c4a6e">Graphs</text>

    <!-- level 2 -->
    <line x1="150" y1="372" x2="100" y2="425" class="link"/>
    <line x1="150" y1="372" x2="190" y2="425" class="link"/>
    <line x1="310" y1="372" x2="270" y2="425" class="link"/>
    <line x1="310" y1="372" x2="360" y2="425" class="link"/>
    <circle cx="100" cy="435" r="22" class="node"/>
    <text x="100" y="439" class="chip" text-anchor="middle" fill="#0c4a6e" font-size="10">image</text>
    <circle cx="190" cy="435" r="22" class="node"/>
    <text x="190" y="439" class="chip" text-anchor="middle" fill="#0c4a6e" font-size="10">volume</text>
    <circle cx="270" cy="435" r="22" class="node"/>
    <text x="270" y="439" class="chip" text-anchor="middle" fill="#0c4a6e" font-size="10">node</text>
    <circle cx="360" cy="435" r="22" class="node"/>
    <text x="360" y="439" class="chip" text-anchor="middle" fill="#0c4a6e" font-size="10">edge</text>
  </g>

  <!-- 1 -> 2 -->
  <path class="edge" d="M420,300 H495"/>
  <text x="458" y="288" class="label" text-anchor="middle">pick term</text>

  <!-- 2. Prompt builder -->
  <g>
    <rect x="500" y="130" width="340" height="350" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <circle cx="524" cy="154" r="12" fill="#2563eb"/><text x="524" y="158" class="step" text-anchor="middle">2</text>
    <text x="544" y="159" class="h">Prompt builder</text>
    <text x="544" y="178" class="sub">four dimensions, each a chip the user can flip</text>

    <text x="524" y="214" class="dim">Term</text>
    <rect x="524" y="222" width="72" height="26" rx="13" fill="#ffffff" stroke="#2563eb"/>
    <text x="560" y="239" class="chip" text-anchor="middle" fill="#1e3a8a">Docker</text>
    <text x="606" y="239" class="note">— e.g.</text>

    <text x="524" y="280" class="dim">Classification</text>
    <rect x="524" y="288" width="46" height="26" rx="13" fill="#2563eb" stroke="#2563eb"/>
    <text x="547" y="305" class="chip" text-anchor="middle" fill="#ffffff">CS</text>
    <rect x="578" y="288" width="78" height="26" rx="13" fill="#ffffff" stroke="#2563eb"/>
    <text x="617" y="305" class="chip" text-anchor="middle" fill="#1e3a8a">Non-CS</text>

    <text x="524" y="346" class="dim">Abstraction level</text>
    <rect x="524" y="354" width="54" height="26" rx="13" fill="#2563eb" stroke="#2563eb"/>
    <text x="551" y="371" class="chip" text-anchor="middle" fill="#ffffff">High</text>
    <rect x="586" y="354" width="54" height="26" rx="13" fill="#ffffff" stroke="#2563eb"/>
    <text x="613" y="371" class="chip" text-anchor="middle" fill="#1e3a8a">Med</text>
    <rect x="648" y="354" width="58" height="26" rx="13" fill="#ffffff" stroke="#2563eb"/>
    <text x="677" y="371" class="chip" text-anchor="middle" fill="#1e3a8a">Deep</text>
    <text x="716" y="371" class="note">("Low" renamed)</text>

    <text x="524" y="412" class="dim">Visual</text>
    <rect x="524" y="420" width="76" height="26" rx="13" fill="#2563eb" stroke="#2563eb"/>
    <text x="562" y="437" class="chip" text-anchor="middle" fill="#ffffff">HTML ★</text>
    <rect x="608" y="420" width="82" height="26" rx="13" fill="#ffffff" stroke="#2563eb"/>
    <text x="649" y="437" class="chip" text-anchor="middle" fill="#1e3a8a">Mermaid</text>
  </g>

  <!-- 2 -> 3 -->
  <path class="edge" d="M840,300 H905"/>
  <text x="872" y="288" class="label" text-anchor="middle">prompt</text>

  <!-- 3. Model -->
  <g>
    <rect x="910" y="250" width="140" height="100" rx="14" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
    <circle cx="934" cy="274" r="12" fill="#9333ea"/><text x="934" y="278" class="step" text-anchor="middle">3</text>
    <text x="954" y="279" class="h">Model</text>
    <text x="930" y="304" class="sub">local Qwen3 or</text>
    <text x="930" y="322" class="sub">Claude via router</text>
  </g>

  <!-- 3 -> 4 -->
  <path class="edge" d="M1050,300 H1115"/>
  <text x="1082" y="288" class="label" text-anchor="middle">source</text>

  <!-- 4. Diagram source -->
  <g>
    <rect x="1120" y="130" width="280" height="200" rx="16" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
    <circle cx="1144" cy="154" r="12" fill="#ca8a04"/><text x="1144" y="158" class="step" text-anchor="middle">4</text>
    <text x="1164" y="159" class="h">Diagram source</text>
    <text x="1144" y="182" class="sub">text the model wrote, in one of:</text>
    <rect x="1144" y="198" width="82" height="26" rx="13" fill="#ffffff" stroke="#ca8a04"/>
    <text x="1185" y="215" class="chip" text-anchor="middle" fill="#854d0e">Mermaid</text>
    <rect x="1234" y="198" width="44" height="26" rx="13" fill="#ffffff" stroke="#ca8a04"/>
    <text x="1256" y="215" class="chip" text-anchor="middle" fill="#854d0e">D2</text>
    <rect x="1286" y="198" width="52" height="26" rx="13" fill="#ffffff" stroke="#ca8a04"/>
    <text x="1312" y="215" class="chip" text-anchor="middle" fill="#854d0e">SVG</text>
    <rect x="1144" y="234" width="76" height="26" rx="13" fill="#ca8a04" stroke="#ca8a04"/>
    <text x="1182" y="251" class="chip" text-anchor="middle" fill="#ffffff">HTML ★</text>
    <text x="1228" y="251" class="note">starred in the sketch</text>
    <!-- tiny diagram glyph -->
    <rect x="1150" y="278" width="40" height="26" rx="4" fill="#ffffff" stroke="#ca8a04"/>
    <rect x="1230" y="278" width="40" height="26" rx="4" fill="#ffffff" stroke="#ca8a04"/>
    <rect x="1310" y="278" width="40" height="26" rx="4" fill="#ffffff" stroke="#ca8a04"/>
    <path d="M1190,291 H1228 M1270,291 H1308" stroke="#ca8a04" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>

  <!-- 4 -> 5 -->
  <path class="edge" d="M1260,330 V395"/>

  <!-- 5. Validation -->
  <g>
    <rect x="1120" y="400" width="280" height="110" rx="16" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <circle cx="1144" cy="424" r="12" fill="#dc2626"/><text x="1144" y="428" class="step" text-anchor="middle">5</text>
    <text x="1164" y="429" class="h">Validation</text>
    <text x="1144" y="454" class="sub">does it parse? does it render?</text>
    <text x="1144" y="472" class="sub">does it actually explain the term</text>
    <text x="1144" y="490" class="sub">at the requested abstraction level?</text>
  </g>
  <!-- retry loop back to model -->
  <path class="edge-retry" d="M1120,455 H980 V355"/>
  <text x="1050" y="474" class="label" text-anchor="middle" fill="#dc2626">fail → retry</text>
  <text x="1050" y="490" class="label" text-anchor="middle" fill="#dc2626">with feedback</text>

  <!-- 5 -> 6 -->
  <path class="edge" d="M1260,510 V575"/>
  <text x="1272" y="548" class="label">pass</text>

  <!-- 6. Render + stream -->
  <g>
    <rect x="1120" y="580" width="280" height="110" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <circle cx="1144" cy="604" r="12" fill="#16a34a"/><text x="1144" y="608" class="step" text-anchor="middle">6</text>
    <text x="1164" y="609" class="h">Render in the app</text>
    <text x="1144" y="634" class="sub">Docker image runner for Mermaid / D2;</text>
    <text x="1144" y="652" class="sub">HTML and SVG render directly in React.</text>
    <text x="1144" y="672" class="sub">Streamed to the UI over WebSocket.</text>
  </g>

  <!-- 6 -> back to graph -->
  <path class="edge" d="M1120,660 H230 V485"/>
  <text x="675" y="648" class="label" text-anchor="middle">attach the diagram to the term node — the graph grows as you learn</text>

  <!-- Footer legend -->
  <g transform="translate(40,760)">
    <path class="edge" d="M0,0 H40"/>
    <text x="50" y="4" class="label">data flow</text>
    <path class="edge-retry" d="M140,0 H180"/>
    <text x="190" y="4" class="label">retry loop</text>
    <rect x="290" y="-10" width="60" height="20" rx="10" fill="#2563eb"/>
    <text x="320" y="4" class="chip" text-anchor="middle" fill="#ffffff">filled</text>
    <text x="360" y="4" class="label">= currently selected option in the example</text>
    <text x="640" y="4" class="label">★ preferred format</text>
  </g>
</svg>
